[project]
name = "csi1000_rank_model_10d"
development_end = "2023-12-31"
training_start = "2019-01-01"
training_end = "2022-12-31"
validation_start = "2023-01-01"
validation_end = "2023-12-31"

[paths]
source_dataset = "../model/data/context_dataset_10d.parquet"
source_schema = "../model/data/context_dataset_10d_schema.json"
rank_dataset = "data/rank_dataset_10d.parquet"
rank_schema = "data/rank_dataset_10d_schema.json"
rank_label_coverage = "data/rank_label_coverage.csv"
runs_dir = "runs"
frozen_spec = "frozen_models.json"
final_runs_dir = "final_runs"
full_model_dataset = "../model/data/model_dataset.parquet"
full_model_schema = "../model/data/model_dataset_schema.json"
full_sample_index = "../model/data/model_sample_index.parquet"
full_split_summary = "../model/data/model_split_summary.json"
market_panel = "../model/data/market_panel.csv"
trading_calendar = "../model/data/trading_calendar.csv"
locked_test_dataset = "data/locked_test_rank_dataset_10d.parquet"
locked_test_schema = "data/locked_test_rank_dataset_10d_schema.json"
locked_test_label_coverage = "data/locked_test_rank_label_coverage.csv"
locked_test_runs_dir = "locked_test_runs"
locked_test_comparison = "locked_test_runs/locked_test_comparison.csv"
locked_test_conclusion = "locked_test_conclusion.json"
strategy_runs_dir = "strategy_runs"
strategy_comparison = "strategy_comparison.csv"
strategy_10d_runs_dir = "strategy_10d_runs"
strategy_10d_comparison = "strategy_10d_comparison.csv"
daily_vs_10d_comparison = "daily_vs_10d_comparison.csv"

[locked_test]
start = "2024-01-01"
end = "2025-12-31"
mad_width = 3.0
date_chunk_size = 60
expected_cross_section_size = 1000
windows = [1, 5, 20]
cap_coverage_threshold = 0.95

[strategy]
start = "2024-01-01"
end = "2025-12-31"
top_k = 100
expected_cross_section_size = 1000
min_listing_days = 120
initial_nav = 1.0
commission_bps = 1.0
slippage_bps = 5.0
sell_stamp_duty_bps = 5.0
limit_tolerance = 1e-8
annualization_days = 252

[strategy_10d]
horizon = 10
offset_count = 10
last_complete_signal = "2025-12-16"
retry_blocked_sells_daily = true
retry_failed_buys_daily = false

[[finalization.candidates]]
run_id = "real-2023-ridge"
model_name = "ridge_rank_regression"
role = "linear_benchmark"

[[finalization.candidates]]
run_id = "real-2023-xgb-reg"
model_name = "xgboost_rank_regression"
role = "stable_tree_ordering"

[[finalization.candidates]]
run_id = "real-2023-lgb-reg"
model_name = "lightgbm_rank_regression"
role = "all_universe_tree_ordering"

[[finalization.candidates]]
run_id = "real-2023-lgb-rank"
model_name = "lightgbm_lambdarank"
role = "top100_primary"

[[finalization.candidates]]
run_id = "real-2023-mlp-top100-hybrid"
model_name = "mlp_top100_hybrid_rank"
role = "neural_candidate"
final_epochs = 12

[models.ridge_rank_regression]
lambda = 1.0

[models.xgboost_rank_regression]

[models.lightgbm_rank_regression]

[models.mlp_rank_regression]

[models.xgboost_pairwise_rank]

[models.lightgbm_lambdarank]

[models.mlp_pairwise_rank]

[models.mlp_top100_hybrid_rank]
hidden_layers = [128, 64, 32]
dropout = 0.1
learning_rate = 0.0003
weight_decay = 0.0001
pairwise_weight = 0.1
boundary_pairs_per_positive = 4
broad_pairs_per_positive = 4
dates_per_batch = 8
max_epochs = 30
patience = 4
min_delta = 0.0001
gradient_clip_norm = 1.0
top_k = 100
seed = 42

[features]
forbidden_columns = [
  "date",
  "stock_code",
  "target_10d",
  "rank_target_10d",
  "market_target_10d",
  "industry_target_10d",
  "alpha_target_10d",
  "exit_date_10d",
  "split_10d",
  "entry_tradeable",
]
